[package]
name = "rtatr"
version = "0.2.4"
edition = "2021"
description = "Rust Task Tracker - a fast file-based task tracker with TQL queries"
license = "GPL-2.0"

[lib]
name = "rtatr"
path = "src/lib.rs"

[[bin]]
name = "rtatr"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
clap = { version = "4", features = ["derive", "env"] }
clap_complete = { version = "4.6", features = ["unstable-dynamic"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"